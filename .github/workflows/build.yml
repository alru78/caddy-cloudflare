name: Build and publish caddy-cloudflare image

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 2'   # Tuesdays at 04:37 UTC, ahead of Wednesday's Watchtower pull
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Get date tag
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}

      - name: Show versions in published image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest caddy build-info | grep -E '^go|caddy-dns/cloudflare|libdns/cloudflare|caddyserver/caddy/v2 '
          docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:latest /etc/alpine-release
